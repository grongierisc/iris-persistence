                      name = case.attrib.get("name", "")
                      problem_cases.append(f"- `{classname}::{name}`: {', '.join(problems)}")

              if problem_cases:
                  summary.write("\n".join(problem_cases[:50]))
                  if len(problem_cases) > 50:
