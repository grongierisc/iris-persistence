[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iris-persistence"
version = "0.1.0"
description = "Python object persistence for InterSystems IRIS, inspired by %Persistent"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "iris-embedded-python-wrapper>=0.5.19",
]

[project.optional-dependencies]
test = [
    "pytest",
]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[tool.hatch.build.targets.wheel]
packages = ["iris_persistence"]

[tool.pytest.ini_options]
markers = [
    "integration: requires a live IRIS runtime",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.9"
packages = ["iris_persistence"]
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
