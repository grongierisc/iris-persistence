name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  repository_dispatch:
    types: [test workflow]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - latest-em
          - latest-cd
          - latest-preview
    steps:
      - uses: actions/checkout@v4

      - name: Run Docker unit tests
        env:
          IRIS_IMAGE_TAG: ${{ matrix.image }}
        run: |
          ./scripts/test-unit.sh --junit-xml=/tmp/test-results.xml

      - name: Find IRIS container
        if: always()
        id: iris-container
        run: |
          echo "id=$(docker compose -f docker-compose-test.yml ps -q iris)" >> "$GITHUB_OUTPUT"

      - name: Copy unit test results
        if: always()
        run: |
          docker cp "${{ steps.iris-container.outputs.id }}:/tmp/test-results.xml" test-results-unit-${{ matrix.image }}.xml || true

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-unit-${{ matrix.image }}
          path: test-results-unit-${{ matrix.image }}.xml
          if-no-files-found: ignore

      - name: Summarize unit test results
        if: always()
        env:
          JUNIT_XML: test-results-unit-${{ matrix.image }}.xml
          SUMMARY_TITLE: Unit test results (${{ matrix.image }})
        run: |
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          path = os.environ["JUNIT_XML"]
          title = os.environ["SUMMARY_TITLE"]
          summary_path = os.environ["GITHUB_STEP_SUMMARY"]

          with open(summary_path, "a", encoding="utf-8") as summary:
              summary.write(f"### {title}\n\n")
              if not os.path.exists(path):
                  summary.write("No JUnit XML file was copied from the IRIS container.\n\n")
                  raise SystemExit(0)

              root = ET.parse(path).getroot()
              suites = [root] if root.tag == "testsuite" else list(root.findall("testsuite"))
              totals = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
              for suite in suites:
                  for key in totals:
                      totals[key] += int(float(suite.attrib.get(key, 0)))

              summary.write(
                  "| tests | failures | errors | skipped |\n"
                  "| ---: | ---: | ---: | ---: |\n"
                  f"| {totals['tests']} | {totals['failures']} | "
                  f"{totals['errors']} | {totals['skipped']} |\n\n"
              )

              problem_cases = []
              for case in root.iter("testcase"):
                  problems = [
                      child.tag
                      for child in case
                      if child.tag in {"failure", "error", "skipped"}
                  ]
                  if problems:
                      classname = case.attrib.get("classname", "")
                      name = case.attrib.get("name", "")
                      problem_cases.append(f"- `{classname}::{name}`: {', '.join(problems)}")

              if problem_cases:
                  summary.write("\n".join(problem_cases[:50]))
                  if len(problem_cases) > 50:
                      summary.write(f"\n- ... {len(problem_cases) - 50} more")
                  summary.write("\n\n")
          PY

  e2e:
    name: E2E (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - latest-em
          - latest-cd
          - latest-preview
    steps:
      - uses: actions/checkout@v4

      - name: Run Docker E2E tests
        env:
          IRIS_IMAGE_TAG: ${{ matrix.image }}
        run: |
          ./scripts/test-docker.sh --junit-xml=/tmp/test-results.xml

      - name: Find IRIS container
        if: always()
        id: iris-container
        run: |
          echo "id=$(docker compose -f docker-compose-test.yml ps -q iris)" >> "$GITHUB_OUTPUT"

      - name: Copy E2E test results
