        with:
          name: test-results-e2e-${{ matrix.image }}
          path: test-results-e2e-${{ matrix.image }}.xml
          if-no-files-found: ignore

      - name: Summarize E2E test results
        if: always()
        env:
          JUNIT_XML: test-results-e2e-${{ matrix.image }}.xml
          SUMMARY_TITLE: E2E test results (${{ matrix.image }})
        run: |
          python3 - <<'PY'
