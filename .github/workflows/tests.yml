              for suite in suites:
                  for key in totals:
                      totals[key] += int(float(suite.attrib.get(key, 0)))

              summary.write(
                  "| tests | failures | errors | skipped |\n"
                  "| ---: | ---: | ---: | ---: |\n"
                  f"| {totals['tests']} | {totals['failures']} | "
                  f"{totals['errors']} | {totals['skipped']} |\n\n"
              )

              problem_cases = []
              for case in root.iter("testcase"):
                  problems = [
                      child.tag
                      for child in case
