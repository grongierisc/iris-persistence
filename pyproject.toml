[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iris-persistence"
version = "0.2.3b5"
description = "Python object persistence for InterSystems IRIS, inspired by %Persistent"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "InterSystems Developer Community" },
]
keywords = ["intersystems", "iris", "embedded-python", "persistence", "objectscript"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "iris-embedded-python-wrapper>=0.5.19",
]

[project.urls]
Homepage = "https://github.com/grongierisc/iris-persistence"
Source = "https://github.com/grongierisc/iris-persistence"
Issues = "https://github.com/grongierisc/iris-persistence/issues"
Documentation = "https://grongierisc.github.io/iris-persistence/"

[project.optional-dependencies]
test = [
    "pytest",
]
dev = [
    "pytest",
    "ruff",
    "mypy>=1.8,<2",
]

[project.scripts]
iris-persistence = "iris_persistence.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["iris_persistence"]

[tool.pytest.ini_options]
markers = [
    "integration: requires a live IRIS runtime",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.10"
packages = ["iris_persistence"]
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "iris"
ignore_missing_imports = true
