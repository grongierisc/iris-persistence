[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iris_orm"
version = "0.1.0"
description = "A small mapper for InterSystems IRIS with a Python-first model class"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "iris-embedded-python-wrapper",
]

[project.optional-dependencies]
test = [
    "pytest",
]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[tool.hatch.build.targets.wheel]
packages = ["iris_orm"]

[tool.pytest.ini_options]
markers = [
    "integration: requires a live IRIS runtime",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.9"
packages = ["iris_orm"]
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
