name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  repository_dispatch:
    types: [test workflow]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - latest-em
          - latest-cd
          - latest-preview
    steps:
      - uses: actions/checkout@v4

      - name: Run Docker unit tests
        env:
          IRIS_IMAGE_TAG: ${{ matrix.image }}
        run: |
          ./scripts/test-unit.sh --junit-xml=/tmp/test-results.xml

      - name: Find IRIS container
        if: always()
        id: iris-container
        run: |
          echo "id=$(docker compose -f docker-compose-test.yml ps -q iris)" >> "$GITHUB_OUTPUT"

      - name: Copy unit test results
        if: always()
        run: |
          docker cp "${{ steps.iris-container.outputs.id }}:/tmp/test-results.xml" test-results-unit-${{ matrix.image }}.xml || true

      - name: Surface failing unit tests
        if: always()
        uses: pmeier/pytest-results-action@master
        with:
          path: test-results-unit-${{ matrix.image }}.xml
          summary: true
          display-options: fEX
          fail-on-empty: false
          title: Unit test results (${{ matrix.image }})

  e2e:
    name: E2E (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - latest-em
          - latest-cd
          - latest-preview
    steps:
      - uses: actions/checkout@v4

      - name: Run Docker E2E tests
        env:
          IRIS_IMAGE_TAG: ${{ matrix.image }}
        run: |
          ./scripts/test-docker.sh --junit-xml=/tmp/test-results.xml

      - name: Find IRIS container
        if: always()
        id: iris-container
        run: |
          echo "id=$(docker compose -f docker-compose-test.yml ps -q iris)" >> "$GITHUB_OUTPUT"

      - name: Copy E2E test results
        if: always()
        run: |
          docker cp "${{ steps.iris-container.outputs.id }}:/tmp/test-results.xml" test-results-e2e-${{ matrix.image }}.xml || true

      - name: Surface failing E2E tests
        if: always()
        uses: pmeier/pytest-results-action@master
        with:
          path: test-results-e2e-${{ matrix.image }}.xml
          summary: true
          display-options: fEX
          fail-on-empty: false
          title: E2E test results (${{ matrix.image }})
